      - others/update.md
      - others/zigbee2mqtt-light-controller.md
      - others/enable-mqtt-plugin.md
      - others/z2m-ha-sensor-deprecated.md
  - faq.md

theme:
  name: material
  # Keep the Material for MkDocs look (Zensical defaults to "modern")
  variant: classic
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  icon:
    repo: material/github
  logo: assets/logo_white.png
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      primary: light blue
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: light blue
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# The supported controllers pages (docs/controllers/) are generated by
# `gen_device_pages.py`, which must run before `zensical build` / `zensical serve`.
plugins:
  - social
  - search
  - redirects:
      redirect_maps:
        # Linked from ControllerX logs (cx_core/action_type/predefined_action_type.py)
        advanced/custom-controllers.md: advanced/index.md
  # Generates /llms.txt, /llms-full.txt and a Markdown version of each page
  # (https://llmstxt.org) so AI assistants can read the documentation.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        ControllerX is an AppDaemon app for Home Assistant that turns button
        controllers (IKEA, Philips Hue, Aqara, Tuya, etc.) into fully working
        light, media player, switch and cover controllers. Each app is
        configured in AppDaemon's `apps.yaml` with `module: controllerx`, a
        device-specific `class` (e.g. `E1810Controller`), the `integration`
        that receives the button events (z2m, deconz, zha, ...), the
        `controller` ID and the entity to control (e.g. `light`). Holding a
        button repeats a Home Assistant service call until it is released.
        Default button mappings can be replaced with a custom `mapping`.

        A machine-readable list of the supported devices, with their
        controller classes and default mappings, is available at
        https://xaviml.github.io/controllerx/controllers/devices.json
      sections:
        Getting started:
          - index.md: What ControllerX is and a quick example
          - start/installation.md: Install ControllerX in Home Assistant
          - start/configuration.md: Generic app parameters for apps.yaml
          - start/type-configuration.md: Parameters for light, media player, switch and cover controllers
          - start/config-builder.md: Interactive apps.yaml generator
        Integrations:
          - start/integrations/*.md
        Supported controllers:
          - controllers/index.md: List of all the supported devices
          - controllers/*.md
        Advanced:
          - advanced/*.md
        Examples:
          - examples/*.md
        Optional:
          - others/*.md
          - faq.md: Frequently asked questions

extra:
  social:
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/xaviml93
      name: xaviml on Twitter
    - icon: fontawesome/brands/github
      link: https://github.com/xaviml
      name: xaviml on GitHub

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
  - attr_list
  - md_in_html

extra_css:
  - assets/stylesheets/controllerx.css

extra_javascript:
  - assets/javascripts/controllerx.js
